version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint 8 declares the peer range typescript >=4.8.4 <6.1.0, so TypeScript 7
      # breaks `npm ci` (ERESOLVE). Remove this rule once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        versions: ['7.x']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
